# =============================================================================
# GitHub Actions —— 持续集成
#
# 三个 job 全部并行执行，且都不需要 service（MySQL / Redis）：
# 后端单测跑在 H2 内存库上，前端单测与构建只依赖 Node。
#   job backend   : mvn -B test（H2）
#   job frontend  : npm ci → npm test（vitest）→ npm run build（vite）
#   job i18n      : i18n 缺失键必须为 0
#
# 本地对应的门禁见 .githooks/pre-commit 与 .githooks/pre-push。
# =============================================================================

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端单测（mvn test / H2）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 并缓存 Maven 仓库
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 运行后端单测
        # 不加 -o（离线）：CI 机器需要联网拉依赖
        run: mvn -B test

  frontend:
    name: 前端单测 + 构建（vitest / vite build）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20 并缓存 npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # 锁文件在 frontend/ 子目录，必须显式指定
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（严格按 lockfile）
        run: npm ci

      - name: 前端单测
        run: npm test

      - name: 前端构建
        run: npm run build

  i18n:
    name: i18n 键完整性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验 i18n 缺失键必须为 0
        # check-i18n-keys.mjs 只负责打印缺失键，自身始终 exit 0；
        # 因此这里捕获输出后显式判空，出现 `MISSING ` 行即失败。
        run: |
          set -euo pipefail
          node scripts/check-i18n-keys.mjs | tee "$RUNNER_TEMP/i18n-keys.out"
          if grep -q '^MISSING ' "$RUNNER_TEMP/i18n-keys.out"; then
            echo "::error::i18n 存在缺失键，门禁失败（详见上方 MISSING 行）"
            exit 1
          fi
